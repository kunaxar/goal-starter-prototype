<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal Starter - prototype</title><meta name="description" content="Goal-first investing prototype. No real accounts, money or orders."><style>:root{--g:#04b488;--g-soft:#e6f7f3;--ink:#44475b;--ink-2:#7c7e8c;--line:#e8e8ec;--bg:#fff}
*{box-sizing:border-box}html,body{margin:0}body{background:#eceef1;color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Inter,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.stage{min-height:100vh;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px #dfe1e6}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.pad{padding:16px}.grow{flex:1}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.searchbar{display:flex;align-items:center;gap:10px;margin:12px 16px 4px;padding:10px 14px;border:1px solid var(--line);border-radius:24px;color:var(--ink-2)}
.logo-dot{width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center}.search-text{flex:1;text-align:center}.avatar{width:26px;height:26px;border-radius:50%;background:#e3e5ea}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tab{flex:1;text-align:center;padding:12px;color:var(--ink-2)}.tab.on{color:var(--g);box-shadow:inset 0 -3px 0 var(--g);font-weight:500}
.sec{font-size:16px;font-weight:500;margin:18px 0 10px}
.hero-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--g-soft);position:relative}
.hero-badge,.pill{background:var(--g);color:#fff;font-size:10px;font-weight:600;letter-spacing:.4px;border-radius:10px;padding:2px 8px;text-transform:uppercase}
.hero-title{font-size:18px;font-weight:500}.hero-sub{color:var(--ink-2)}.hero-cta{margin-top:8px;background:var(--g);color:#fff;border-radius:8px;padding:10px 18px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:12px;background:#f6f6f8;text-align:center;font-size:13px}
.tile.hot{background:var(--g-soft);outline:1.5px solid var(--g)}.tile.soft{opacity:.7}
.tile-icon{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--g)}
.bottomnav{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:#fff}.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;font-size:12px;color:var(--ink-2)}.bn.on{color:#5367ff}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 8px;min-height:56px}.topbar-title{font-weight:500;font-size:16px}
.icon-btn{border:0;background:transparent;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dots{display:flex;gap:6px;margin-bottom:12px}.dot{height:4px;flex:1;border-radius:2px;background:var(--line)}.dot.on{background:var(--g)}
.q{font-size:22px;line-height:1.25;font-weight:500;margin:4px 0 18px}.q.c{margin-top:16px}.sub{color:var(--ink-2);max-width:320px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;min-height:96px}
.goal-card.on{border-color:var(--g);background:var(--g-soft)}.goal-card .tile-icon{background:var(--g-soft)}.goal-card.on .tile-icon{background:#fff}
.big-input{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--g);padding:6px 0;margin-bottom:12px}
.big-input .rs{font-size:32px;font-weight:500}.big-input input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:36px;font-weight:500;color:var(--ink);background:transparent}.per{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 16px;min-height:40px}.chip.on{border-color:var(--g);background:var(--g-soft);color:#037a5d;font-weight:500}
.label{color:var(--ink-2);margin:18px 0 8px}.hint{color:var(--ink-2);margin-top:8px}.err{color:#d9534f;margin:4px 0 12px}
.cta-bar{position:sticky;bottom:0;padding:12px 16px;background:#fff;border-top:1px solid var(--line)}
.cta{width:100%;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:500;font-size:15px;padding:14px;min-height:48px}.cta:disabled{background:#cfd3d9;cursor:not-allowed}
.summary{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink-2)}.sum-top b{font-size:28px;font-weight:500;color:var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:12px 0 8px}.bar-fill{height:100%;background:var(--g);border-radius:5px;transition:width .25s}
.sum-row{display:flex;justify-content:space-between;color:var(--ink-2);font-size:13px;gap:8px;flex-wrap:wrap}
.gap{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;background:#fff4e5}.gap b{font-size:18px;font-weight:500}.gap.ok{background:var(--g-soft)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 2px;min-height:52px}.opt-go{color:var(--g);font-weight:500}
.foot{color:var(--ink-2);font-size:12px;margin-top:14px}
.check{width:72px;height:72px;border-radius:50%;background:var(--g-soft);color:var(--g);display:flex;align-items:center;justify-content:center}
.disclaimer{margin:0;padding:8px 16px 12px;text-align:center;color:var(--ink-2);font-size:11px}

.search-input{flex:1;min-width:0;border:0;outline:0;font:inherit;background:transparent;color:var(--ink);text-align:center}
.clear{border:0;background:#eceef1;width:26px;height:26px;border-radius:50%;color:var(--ink-2)}
button.tab{background:transparent;border:0;font:inherit}.count{margin-left:6px;background:var(--g);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
button.bn{background:transparent;border:0}
.tiles{grid-template-columns:repeat(3,1fr)}
.tile-icon.sm{width:34px;height:34px;border-radius:10px;background:var(--g-soft)}.row-l{display:flex;align-items:center;gap:12px}
.goal-row{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin-bottom:10px}
.row-top{display:flex;justify-content:space-between;gap:8px;font-weight:500}.row-top i{font-style:normal;color:var(--ink-2);font-weight:400;font-size:12px}.row-sub{color:var(--ink-2);font-size:12px}
.bar.small{height:6px;margin:0;display:block}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 12px;gap:6px}.empty-t{font-size:18px;font-weight:500;margin:10px 0 0}.cta.narrow{width:auto;padding:12px 28px;margin-top:12px}
.months{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}.m{width:14px;height:14px;border-radius:50%;background:var(--line)}.m.on{background:var(--g)}
.opt:disabled{opacity:.45;cursor:not-allowed}.opt.danger .opt-go{color:#d9534f}

.confirm{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);color:#d9534f}.confirm-btns{display:flex;gap:16px}.confirm-btns button{border:0;background:transparent;min-height:44px;padding:0 6px}.danger-t{color:#d9534f!important}

.rail{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory}.rail::-webkit-scrollbar{display:none}
.rail-card{flex:0 0 78%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:16px}.rail-t{font-weight:500;font-size:15px}.rail-s{color:var(--ink-2);font-size:13px}
.rail{scroll-padding-left:16px}.rail-card{flex-basis:72%}

.pill-t{display:inline-block;background:var(--g-soft);color:#037a5d;border-radius:10px;padding:2px 10px;font-weight:500;margin:0 0 10px}.fact{font-size:16px;line-height:1.5;margin:0 0 6px}.src{color:var(--ink-2);font-size:12px;margin:0 0 6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.opts .goal-card{min-height:110px}.rail-s{color:var(--ink-2);font-size:13px;font-weight:400}
.opt.sel,.opt.right{background:var(--g-soft)}.opt.wrong{background:#fdecea}.fb{background:#fff4e5;border-radius:12px;padding:12px 14px;margin:12px 0;color:var(--ink)}.fb.ok{background:var(--g-soft)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.fund{display:flex;flex-direction:column;gap:8px;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:14px}.fund.on{border-color:var(--g);background:var(--g-soft)}.fund span{display:flex;flex-direction:column;font-size:13px}.fund i{font-style:normal;color:var(--ink-2);font-size:11px}
.summary .sum-row{margin-top:8px;align-items:baseline;justify-content:space-between}.summary .sum-row b{font-weight:500;text-align:right}
.summary .sum-top b.sm{font-size:17px}

.chart{display:flex;flex-direction:column;gap:10px;margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:12px}.chart.small{margin:8px 0}
.crow{display:grid;grid-template-columns:38px 1fr 104px;gap:8px;align-items:center}.cl{color:var(--ink-2);font-size:12px}.cbars{display:flex;flex-direction:column;gap:3px}.cb{display:block;height:9px;border-radius:5px;min-width:3px}.cb.put{background:#cfd3d9}.cb.up{background:var(--g)}.cb.dn{background:#f0a24b}
.cv{display:flex;flex-direction:column;font-size:13px;text-align:right}.cv i{font-style:normal;color:var(--ink-2);font-size:11px}
.legend{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12px;margin:4px 0 0}.sw{width:10px;height:10px;border-radius:3px;display:inline-block}.sw.put{background:#cfd3d9}.sw.up{background:var(--g);margin-left:10px}.crow{grid-template-columns:64px 1fr}
.chart.small .crow{grid-template-columns:44px 1fr 74px}.gap+.fact{margin-top:14px}.fact{margin-bottom:10px}
.chip small{display:block;color:var(--ink-2);font-size:11px}.chip.on small{color:#037a5d}.det{margin:6px 0 10px;color:var(--ink-2)}.det summary{cursor:pointer;color:var(--g);font-weight:500;padding:6px 0}.det p{margin:4px 0 0;line-height:1.5}.gap small{color:var(--ink-2);font-size:12px}

.integrated{border-top:1px solid var(--line);margin-top:20px;padding-top:8px}.meaning{display:flex;gap:12px;align-items:center;padding:14px;background:var(--g-soft);border-radius:12px}.meaning-icon{font-size:32px;color:var(--g)}details{margin:12px 0}summary{cursor:pointer;font-weight:500;padding:10px 0;color:var(--ink)}.example-number{display:flex;flex-direction:column;margin:16px 0}.example-number b{font-size:30px;font-weight:500}.example-number small{color:var(--ink-2)}.compare-bars{display:flex;flex-direction:column;gap:10px}.compare-bars span{font-size:12px;color:var(--ink-2)}.compare-bars i{display:block;height:12px;background:var(--g);border-radius:6px;margin-bottom:4px}.text-link{border:0;background:transparent;color:#037a5d;padding:12px 0;text-align:left}.payday{display:flex;gap:10px;align-items:center;padding:12px 0}.payday input{accent-color:var(--g);width:18px;height:18px}.habit{background:var(--g-soft);padding:12px;border-radius:8px}.cash-bars span{display:block;margin:8px 0;font-size:12px}.cash-bars i{display:block;height:12px;background:var(--g);border-radius:6px;margin-top:4px}.src a{color:#037a5d}.big-input{margin:10px 0}.label{margin-top:18px}
.compound .eyebrow{font-size:11px;letter-spacing:1px;font-weight:700;color:#00896a;margin:0 0 12px}.compound .sec{font-size:25px;line-height:1.25;margin:0 0 12px}.compound .example-number{padding:22px 0 18px}.compound .example-number b{font-size:42px;line-height:1.2;margin:7px 0}.stacked{height:15px;border-radius:9px;overflow:hidden;display:flex;background:#e5e9ef}.stacked i{background:#b4c2d2;display:block}.stacked .gain,.money-split i.gain{background:#00b386}.stacked .loss,.money-split i.loss{background:#dc6d6d}.money-split{display:flex;gap:18px;margin:16px 0 21px}.money-split span{flex:1;font-size:12px;color:#697284}.money-split i{display:inline-block;width:8px;height:8px;background:#b4c2d2;border-radius:2px;margin-right:6px}.money-split b{display:block;color:#263249;font-size:20px;margin-top:7px}.compound-story{font-size:15px;line-height:1.55;margin:0 0 11px}.riskline{font-size:12px!important}.horizon-switch{display:flex;gap:8px;margin:19px 0 10px}.horizon-switch .chip{padding:11px 12px;font-size:12px;flex:1}.saving-details{margin-top:20px}.saving-details>.summary{margin-top:20px}.compound{border-top:0!important;padding-top:10px!important}

.contribution-first{padding:18px 18px 12px;background:#f3f7f6;border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:5px}.contribution-first span,.contribution-first small{font-size:14px;color:#60706b}.contribution-first b{font-size:30px;color:#1e302a}.compound .example-number{border-radius:0 0 16px 16px;margin-top:0;padding-top:14px;border-top:1px solid #cbe6dd}
.fund-picker{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.fund-picker select{width:100%;padding:13px 12px;background:white;border:1px solid #cdd2d8;border-radius:10px;color:var(--ink);font:inherit}.fund-facts{margin:12px 0;padding:14px;border-radius:12px;background:#f5f7f9}.fund-facts>b,.fund-facts>span,.fund-facts>small{display:block}.fund-facts>span,.fund-facts>small{font-size:12px;color:#646877}.fund-facts p{font-size:13px;margin:10px 0}.fund-facts a{font-size:13px;color:#08785f}.fund-facts small{margin-top:10px}.risk-pill{font-weight:600}.probability{font-size:13px;font-weight:600;margin:10px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
