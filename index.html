<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal Starter - concept prototype</title><meta name="description" content="Concept prototype for a Groww case study. No real accounts, money or orders."><style>:root{--g:#04b488;--g-soft:#e6f7f3;--ink:#44475b;--ink-2:#7c7e8c;--line:#e8e8ec;--bg:#fff}
*{box-sizing:border-box}html,body{margin:0}body{background:#eceef1;color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Inter,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.stage{min-height:100vh;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 1px #dfe1e6}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.pad{padding:16px}.grow{flex:1}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.searchbar{display:flex;align-items:center;gap:10px;margin:12px 16px 4px;padding:10px 14px;border:1px solid var(--line);border-radius:24px;color:var(--ink-2)}
.logo-dot{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#5367ff,#04b488)}.search-text{flex:1;text-align:center}.avatar{width:26px;height:26px;border-radius:50%;background:#9b59b6}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tab{flex:1;text-align:center;padding:12px;color:var(--ink-2)}.tab.on{color:var(--g);box-shadow:inset 0 -3px 0 var(--g);font-weight:500}
.sec{font-size:16px;font-weight:500;margin:18px 0 10px}
.hero-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--g-soft);position:relative}
.hero-badge,.pill{background:var(--g);color:#fff;font-size:10px;font-weight:600;letter-spacing:.4px;border-radius:10px;padding:2px 8px;text-transform:uppercase}
.hero-title{font-size:18px;font-weight:500}.hero-sub{color:var(--ink-2)}.hero-cta{margin-top:8px;background:var(--g);color:#fff;border-radius:8px;padding:10px 18px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border:0;border-radius:12px;background:#f6f6f8;text-align:center;font-size:13px}
.tile.hot{background:var(--g-soft);outline:1.5px solid var(--g)}.tile.soft{opacity:.7}
.tile-icon{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--g)}
.bottomnav{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:#fff}.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;font-size:12px;color:var(--ink-2)}.bn.on{color:#5367ff}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 8px;min-height:56px}.topbar-title{font-weight:500;font-size:16px}
.icon-btn{border:0;background:transparent;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.dots{display:flex;gap:6px;margin-bottom:12px}.dot{height:4px;flex:1;border-radius:2px;background:var(--line)}.dot.on{background:var(--g)}
.q{font-size:22px;line-height:1.25;font-weight:500;margin:4px 0 18px}.q.c{margin-top:16px}.sub{color:var(--ink-2);max-width:320px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;min-height:96px}
.goal-card.on{border-color:var(--g);background:var(--g-soft)}.goal-card .tile-icon{background:var(--g-soft)}.goal-card.on .tile-icon{background:#fff}
.big-input{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--g);padding:6px 0;margin-bottom:12px}
.big-input .rs{font-size:32px;font-weight:500}.big-input input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:36px;font-weight:500;color:var(--ink);background:transparent}.per{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 16px;min-height:40px}.chip.on{border-color:var(--g);background:var(--g-soft);color:#037a5d;font-weight:500}
.label{color:var(--ink-2);margin:18px 0 8px}.hint{color:var(--ink-2);margin-top:8px}.err{color:#d9534f;margin:4px 0 12px}
.cta-bar{position:sticky;bottom:0;padding:12px 16px;background:#fff;border-top:1px solid var(--line)}
.cta{width:100%;border:0;border-radius:8px;background:var(--g);color:#fff;font-weight:500;font-size:15px;padding:14px;min-height:48px}.cta:disabled{background:#cfd3d9;cursor:not-allowed}
.summary{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.sum-top{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink-2)}.sum-top b{font-size:28px;font-weight:500;color:var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:12px 0 8px}.bar-fill{height:100%;background:var(--g);border-radius:5px;transition:width .25s}
.sum-row{display:flex;justify-content:space-between;color:var(--ink-2);font-size:13px;gap:8px;flex-wrap:wrap}
.gap{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;background:#fff4e5}.gap b{font-size:18px;font-weight:500}.gap.ok{background:var(--g-soft)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 2px;min-height:52px}.opt-go{color:var(--g);font-weight:500}
.foot{color:var(--ink-2);font-size:12px;margin-top:14px}
.check{width:72px;height:72px;border-radius:50%;background:var(--g-soft);color:var(--g);display:flex;align-items:center;justify-content:center}
.disclaimer{margin:0;padding:8px 16px 12px;text-align:center;color:var(--ink-2);font-size:11px}

.search-input{flex:1;min-width:0;border:0;outline:0;font:inherit;background:transparent;color:var(--ink);text-align:center}
.clear{border:0;background:#eceef1;width:26px;height:26px;border-radius:50%;color:var(--ink-2)}
button.tab{background:transparent;border:0;font:inherit}.count{margin-left:6px;background:var(--g);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
button.bn{background:transparent;border:0}
.tiles{grid-template-columns:repeat(3,1fr)}
.tile-icon.sm{width:34px;height:34px;border-radius:10px;background:var(--g-soft)}.row-l{display:flex;align-items:center;gap:12px}
.goal-row{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px;margin-bottom:10px}
.row-top{display:flex;justify-content:space-between;gap:8px;font-weight:500}.row-top i{font-style:normal;color:var(--ink-2);font-weight:400;font-size:12px}.row-sub{color:var(--ink-2);font-size:12px}
.bar.small{height:6px;margin:0;display:block}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 12px;gap:6px}.empty-t{font-size:18px;font-weight:500;margin:10px 0 0}.cta.narrow{width:auto;padding:12px 28px;margin-top:12px}
.months{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}.m{width:14px;height:14px;border-radius:50%;background:var(--line)}.m.on{background:var(--g)}
.opt:disabled{opacity:.45;cursor:not-allowed}.opt.danger .opt-go{color:#d9534f}
