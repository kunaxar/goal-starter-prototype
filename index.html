<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal Starter - concept prototype</title><meta name="description" content="Concept prototype for a Groww case study. No real accounts, money or orders."><style>:root{--ds-page:#f5f7f8;--ds-ink:#1b2430;--ds-ink-2:#5a6573;--ds-hairline:#dfe4ea}
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#1b2430;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{max-width:640px;margin:0 auto;padding:20px 16px 40px}h1{margin:.2em 0 .1em;font-size:1.7rem}h2{font-size:1.15rem;margin:1.2em 0 .5em}
.fact{color:#5a6573;font-size:.9rem;margin:0 0 .4em}.lbl{display:block;font-weight:600;margin:.9em 0 .35em}
.choice-set{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1.5px solid #c5cdd6;background:#fff;border-radius:10px;padding:10px 14px;font:inherit;min-height:44px;cursor:pointer}.choice.on{border-color:#00a97f;background:#e6f7f2;font-weight:600}
input[type=text]{width:100%;padding:11px 12px;border:1.5px solid #c5cdd6;border-radius:10px;font:inherit;background:#fff}input[type=range]{width:100%;accent-color:#00a97f}.val{font-size:1.3rem;font-weight:700}
.callout{border-radius:10px;padding:10px 14px;margin:12px 0;background:#eef2f6}.callout.warning{background:#fff4e0}.callout p{margin:.2em 0 0}
.caption{color:#5a6573;font-size:.92rem}.facts{margin:12px 0}.facts div{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #dfe4ea}.facts dt{color:#5a6573}.facts dd{margin:0;font-weight:600;text-align:right}
.btn{font:inherit;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer;border:1.5px solid #c5cdd6;background:#fff}.btn.primary{background:#00a97f;border-color:#00a97f;color:#fff;font-weight:600}.btn.ghost{background:transparent}.btn.compact{min-height:36px;padding:6px 12px}.btn:disabled{opacity:.45;cursor:not-allowed}
footer{margin-top:24px;color:#5a6573;font-size:.85rem;text-align:center}a{color:#067a5c}
html, body, #root { margin: 0; min-height: 100%; }
body { background: var(--ds-page); }
.file-nav { display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--ds-hairline); }
.file-nav a { padding: 10px 0; color: var(--ds-ink-2); text-decoration: none; }
.file-nav a[aria-current="page"] { color: var(--ds-ink); box-shadow: inset 0 -1px 0 var(--ds-ink); }
@media (max-width: 600px) { .file-nav a { display: inline-flex; align-items: center; min-height: 44px; } }
.steps { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 4px 0 12px; font-size: 13px; color: var(--ds-ink-2); }
.step.is-on { color: var(--ds-ink); font-weight: 600; box-shadow: inset 0 -1px 0 var(--ds-ink); }
.step.is-done { color: var(--ds-ink); }
.big { font-size: 20px; line-height: 1.35; margin: 8px 0 14px; }
.bar { height: 14px; border-radius: 7px; background: var(--ds-hairline); overflow: hidden; margin: 6px 0 16px; }
.bar-fill { height: 100%; background: var(--ds-ink); border-radius: 7px; transition: width .25s ease; }
.options { margin-top: 18px; }
.options-title { font-weight: 600; margin: 0 0 8px; }
.option { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--ds-hairline); }
.nav { display: flex; gap: 12px; justify-content: space-between; margin: 20px 0 8px; }
